<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pargo's Chest">
    <meta name="description" content="Your personal clipboard treasure chest - store, organize and access your clips anywhere">

    <title>Pargo's Chest - Clipboard Manager</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="treasure-icon">🏴‍☠️</span>
                    Pargo's Chest
                </h1>
                <button id="menuBtn" class="icon-btn" aria-label="Menu">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Add Clip Section -->
            <section class="add-clip-section">
                <div class="input-group">
                    <textarea
                        id="clipInput"
                        class="clip-input"
                        placeholder="Paste or type your treasure here..."
                        rows="4"
                        aria-label="Clip content input"
                    ></textarea>
                    <div class="button-group">
                        <button id="pasteBtn" class="btn btn-secondary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                            </svg>
                            Paste
                        </button>
                        <button id="addBtn" class="btn btn-primary">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            Add to Chest
                        </button>
                    </div>
                </div>
            </section>

            <!-- Search & Filter -->
            <section class="filter-section">
                <div class="search-box">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input
                        type="text"
                        id="searchInput"
                        class="search-input"
                        placeholder="Search your treasures..."
                        aria-label="Search clips"
                    >
                </div>
            </section>

            <!-- Clips List -->
            <section class="clips-section">
                <div id="clipsList" class="clips-list">
                    <!-- Clips will be dynamically inserted here -->
                </div>
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">📦</div>
                    <h2>Your chest is empty</h2>
                    <p>Add your first treasure above!</p>
                </div>
            </section>
        </main>

        <!-- Side Panel (Settings/Menu) -->
        <aside id="sidePanel" class="side-panel">
            <div class="panel-header">
                <h2>Settings</h2>
                <button id="closePanelBtn" class="icon-btn" aria-label="Close panel">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="panel-content">
                <div class="setting-item">
                    <label class="setting-label">
                        <input type="checkbox" id="darkModeToggle" checked>
                        <span>Dark Mode</span>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="setting-label">
                        <input type="checkbox" id="autoSaveToggle" checked>
                        <span>Auto-save clips</span>
                    </label>
                </div>
                <div class="setting-item">
                    <button id="clearAllBtn" class="btn btn-danger btn-full">
                        Clear All Clips
                    </button>
                </div>
                <div class="setting-item">
                    <button id="exportBtn" class="btn btn-secondary btn-full">
                        Export Data
                    </button>
                </div>
                <div class="app-info">
                    <p class="offline-status">
                        <span class="status-indicator" id="onlineStatus"></span>
                        <span id="statusText">Online</span>
                    </p>
                    <p class="version">Version 1.0.0</p>
                    <p class="pwa-badge" id="pwaBadge" style="display: none;">
                        ✓ Installed as PWA
                    </p>
                </div>
            </div>
        </aside>

        <!-- Overlay for mobile panel -->
        <div id="overlay" class="overlay"></div>

        <!-- Toast Notifications -->
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <!-- Install PWA Prompt -->
    <div id="installPrompt" class="install-prompt" style="display: none;">
        <div class="install-content">
            <span class="install-icon">📱</span>
            <div class="install-text">
                <strong>Install Pargo's Chest</strong>
                <small>Add to your home screen for quick access</small>
            </div>
            <button id="installBtn" class="btn btn-primary btn-sm">Install</button>
            <button id="dismissInstallBtn" class="icon-btn" aria-label="Dismiss">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/app.js"></script>
</body>
</html>
