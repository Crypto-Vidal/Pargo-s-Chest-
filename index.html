<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightning Circuit Animation - Pargo's Chest</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <canvas id="lightning-canvas" class="lightning-background"></canvas>
        <div class="content">
            <h1>⚡ Pargo's Chest</h1>
            <p>Featuring animated circuit-board lightning effects</p>
        </div>
    </div>

    <div class="controls">
        <button id="toggle-animation">Pause Animation</button>
        <button id="toggle-performance">High Performance</button>
    </div>

    <script type="module" src="lightning-animation.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
